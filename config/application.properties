# ── Database ────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:poker}
quarkus.datasource.password=${DB_PASSWORD:poker321}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/poker}

# Connection pool – keep 10 warm, allow up to 60 under load
quarkus.datasource.jdbc.initial-size=10
quarkus.datasource.jdbc.min-size=10
quarkus.datasource.jdbc.max-size=60
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.background-validation-interval=30

# Flyway manages schema migrations – version-controlled, no manual changes
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=5
quarkus.flyway.locations=db/migration

# ── Redis ────────────────────────────────────────────────────────────────────
quarkus.redis.hosts=${REDIS_URL:redis://127.0.0.1:6379}
quarkus.redis.timeout=5s

# ── Security ─────────────────────────────────────────────────────────────────
quarkus.http.auth.proactive=false
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY:secrets/privateKey.pem}
smallrye.jwt.verify.key.location=${JWT_VERIFY_KEY:secrets/publicKey.pem}
smallrye.jwt.accepted-issuers=${JWT_ISSUER:https://manestack.dev}
mp.jwt.verify.publickey.location=${JWT_VERIFY_KEY:secrets/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:https://manestack.dev}

# ── HTTP / WebSocket ──────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/health
quarkus.http.http2=true
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,text/plain

# ── Metrics / Monitoring ─────────────────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm.enabled=true
quarkus.micrometer.binder.system.enabled=true
quarkus.micrometer.binder.vertx.enabled=true

# ── OpenAPI / Swagger ────────────────────────────────────────────────────────
mp.openapi.extensions.smallrye.info.title=Poker Engine API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Backend API for the poker platform

# ── Bean Validation ──────────────────────────────────────────────────────────
quarkus.hibernate-validator.method-validation=auto

# ── Vert.x / performance ─────────────────────────────────────────────────────
quarkus.vertx.prefer-native-transport=true
